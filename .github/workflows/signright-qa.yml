name: SignRight QA Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install @playwright/test
          npx playwright install chromium --with-deps

      - name: Write test file
        run: |
          cat > signright.spec.js << 'EOF'
          const { test, expect } = require('@playwright/test');

          test('homepage loads', async ({ page }) => {
            await page.goto('https://signright.io');
            await expect(page).toHaveTitle(/.+/);
          });

          test('no console errors', async ({ page }) => {
            const errors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push(msg.text());
            });
            await page.goto('https://signright.io');
            expect(errors).toHaveLength(0);
          });

          test('form is visible', async ({ page }) => {
            await page.goto('https://signright.io');
            const form = page.locator('form').first();
            await expect(form).toBeVisible();
          });

          test('page loads under 3 seconds', async ({ page }) => {
            const start = Date.now();
            await page.goto('https://signright.io');
            expect(Date.now() - start).toBeLessThan(3000);
          });
          EOF

      - name: Run tests
        run: npx playwright test signright.spec.js --reporter=json > results.json 2>&1
        continue-on-error: true

      - name: Summarize with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'EOF'
          import json, os, urllib.request

          try:
              raw = open('results.json').read()
              start = raw.find('{')
              summary = raw[start:][:3000] if start != -1 else "No results"
          except:
              summary = "Could not read results"

          body = json.dumps({
              "model": "claude-haiku-5-5",
              "max_tokens": 400,
              "messages": [{
                  "role": "user",
                  "content": f"SignRight QA results: {summary}\n\n5-line plain English: what passed, what failed, what needs fixing."
              }]
          }).encode()

          req = urllib.request.Request(
              'https://api.anthropic.com/v1/messages',
              data=body,
              headers={
                  'x-api-key': os.environ['ANTHROPIC_API_KEY'],
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json'
              }
          )
          resp = json.loads(urllib.request.urlopen(req).read())
          print("=== CLAUDE SUMMARY ===")
          print(resp['content'][0]['text'])
          EOF

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signright-qa-${{ github.run_number }}
          path: results.json
